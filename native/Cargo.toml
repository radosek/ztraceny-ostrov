[package]
name = "ztraceny-ostrov"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Native runner for the Czech adventure game Ztracený Ostrov (2000)"

[[bin]]
name = "ostrov"
path = "src/main.rs"

[dependencies]
ostrov-core = { path = "../core" }
anyhow = "1"
pixels = "0.17"
winit = "0.30"
rodio = { version = "0.23", default-features = false, features = ["playback"] }
gilrs = "0.11"
dirs = "6"
rfd = "0.15"
rubato = "5.0.1"
audioadapter-buffers = "5"
