name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macos-universal
          - os: windows-2022
            name: windows-x64
          - os: ubuntu-22.04
            name: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev \
            libwayland-dev libgtk-3-dev libfuse2

      - name: Test
        run: cargo test --workspace --exclude ostrov-web

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ./scripts/package-macos.sh

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --release -p ztraceny-ostrov
          mkdir -p dist
          cp target/release/ostrov.exe "dist/Ztraceny Ostrov.exe"
          cp README.md dist/
          cd dist && 7z a ztraceny-ostrov-windows-x64.zip "Ztraceny Ostrov.exe" README.md

      - name: Package (Linux AppImage)
        if: runner.os == 'Linux'
        run: ./scripts/package-linux.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ztraceny-ostrov-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.AppImage

  web:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: wasm-bindgen
        run: cargo install wasm-bindgen-cli --version "$(grep -A1 'name = "wasm-bindgen"' Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p' | head -1)" --locked
      - name: Build player bundle
        run: ./web/build.sh
      - run: tar -czf ztraceny-ostrov-web.tar.gz -C web/dist .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ztraceny-ostrov-web
          path: ztraceny-ostrov-web.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, web]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/*
